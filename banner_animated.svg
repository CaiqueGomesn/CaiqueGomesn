<svg viewBox="0 0 1280 320" width="1280" height="320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#032A42;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#06445F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#032A42;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glowGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00D9FF;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#00BCEB;stop-opacity:0" />
    </radialGradient>
    <filter id="cyanGlowFilter">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      @keyframes float-glow { 0% { opacity: 0.2; } 50% { opacity: 0.5; } 100% { opacity: 0.2; } }
      @keyframes rotate-gear { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes pulse-dot { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
      @keyframes text-glow { 0%, 100% { opacity: 0.8; } 50% { opacity: 1; } }
      .float-glow { animation: float-glow 4s ease-in-out infinite; }
      .rotate-gear { animation: rotate-gear 20s linear infinite; }
      .pulse-dot { animation: pulse-dot 2s ease-in-out infinite; }
      .text-glow { animation: text-glow 3s ease-in-out infinite; }
    </style>
  </defs>
  <rect width="1280" height="320" fill="url(#bgGradient)"/>
  <circle cx="320" cy="160" r="200" fill="url(#glowGradient)" class="float-glow" opacity="0.15"/>
  <circle cx="960" cy="160" r="200" fill="url(#glowGradient)" class="float-glow" opacity="0.15" style="animation-delay: 2s;"/>
  <g id="warehouse">
    <rect x="50" y="80" width="150" height="180" fill="none" stroke="#00BCEB" stroke-width="2" opacity="0.6"/>
    <line x1="50" y1="120" x2="200" y2="120" stroke="#00BCEB" stroke-width="1.5" opacity="0.5"/>
    <line x1="50" y1="160" x2="200" y2="160" stroke="#00BCEB" stroke-width="1.5" opacity="0.5"/>
    <line x1="50" y1="200" x2="200" y2="200" stroke="#00BCEB" stroke-width="1.5" opacity="0.5"/>
    <rect x="70" y="90" width="20" height="20" fill="none" stroke="#00D9FF" stroke-width="1.5"/>
    <rect x="100" y="90" width="20" height="20" fill="none" stroke="#00D9FF" stroke-width="1.5"/>
    <rect x="130" y="90" width="20" height="20" fill="none" stroke="#00D9FF" stroke-width="1.5"/>
    <rect x="160" y="90" width="20" height="20" fill="none" stroke="#00D9FF" stroke-width="1.5"/>
    <rect x="70" y="130" width="20" height="20" fill="none" stroke="#00D9FF" stroke-width="1.5" opacity="0.7"/>
    <rect x="100" y="130" width="20" height="20" fill="none" stroke="#00D9FF" stroke-width="1.5" opacity="0.7"/>
    <rect x="130" y="130" width="20" height="20" fill="none" stroke="#00D9FF" stroke-width="1.5" opacity="0.7"/>
    <rect x="70" y="170" width="20" height="20" fill="none" stroke="#00D9FF" stroke-width="1.5" opacity="0.5"/>
    <rect x="100" y="170" width="20" height="20" fill="none" stroke="#00D9FF" stroke-width="1.5" opacity="0.5"/>
    <rect x="50" y="235" width="150" height="8" fill="none" stroke="#00BCEB" stroke-width="2"/>
    <circle cx="65" cy="239" r="4" fill="#00D9FF" opacity="0.6"/>
    <circle cx="125" cy="239" r="4" fill="#00D9FF" opacity="0.6"/>
    <circle cx="185" cy="239" r="4" fill="#00D9FF" opacity="0.6"/>
  </g>
  <g id="connection-left">
    <path d="M 200 160 Q 350 140 480 160" fill="none" stroke="#00BCEB" stroke-width="2" opacity="0.6"/>
    <circle cx="250" cy="155" r="3" fill="#00D9FF" filter="url(#softGlow)">
      <animate attributeName="cx" from="200" to="480" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="cy" from="160" to="160" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="150" r="2" class="pulse-dot" fill="#00D9FF"/>
    <circle cx="400" cy="155" r="2" class="pulse-dot" fill="#00D9FF" style="animation-delay: 0.5s;"/>
  </g>
  <g id="center-hub">
    <circle cx="640" cy="160" r="80" fill="url(#glowGradient)" opacity="0.2"/>
    <g id="gear" transform="translate(640, 160)" class="rotate-gear">
      <circle cx="0" cy="0" r="45" fill="none" stroke="#00BCEB" stroke-width="2" opacity="0.8"/>
      <circle cx="0" cy="0" r="30" fill="none" stroke="#00BCEB" stroke-width="1.5" opacity="0.6"/>
      <rect x="-4" y="-50" width="8" height="10" fill="#00D9FF" opacity="0.8"/>
      <rect x="35" y="-35" width="10" height="8" fill="#00D9FF" opacity="0.8" transform="rotate(45 40 -31)"/>
      <rect x="50" y="0" width="10" height="8" fill="#00D9FF" opacity="0.8"/>
      <rect x="35" y="35" width="8" height="10" fill="#00D9FF" opacity="0.8"/>
      <rect x="-4" y="50" width="8" height="10" fill="#00D9FF" opacity="0.8"/>
      <rect x="-50" y="0" width="10" height="8" fill="#00D9FF" opacity="0.8"/>
      <circle cx="0" cy="0" r="8" fill="#00D9FF" opacity="0.9" filter="url(#cyanGlowFilter)"/>
      <circle cx="0" cy="0" r="5" fill="#06445F"/>
    </g>
    <circle cx="640" cy="80" r="2" fill="#00D9FF" class="pulse-dot"/>
    <circle cx="710" cy="110" r="2" fill="#00D9FF" class="pulse-dot" style="animation-delay: 0.5s;"/>
    <circle cx="710" cy="210" r="2" fill="#00D9FF" class="pulse-dot" style="animation-delay: 1s;"/>
    <circle cx="640" cy="240" r="2" fill="#00D9FF" class="pulse-dot" style="animation-delay: 1.5s;"/>
    <circle cx="570" cy="210" r="2" fill="#00D9FF" class="pulse-dot" style="animation-delay: 1s;"/>
    <circle cx="570" cy="110" r="2" fill="#00D9FF" class="pulse-dot" style="animation-delay: 0.5s;"/>
  </g>
  <g id="connection-right">
    <path d="M 800 160 Q 930 140 1050 160" fill="none" stroke="#00BCEB" stroke-width="2" opacity="0.6"/>
    <circle cx="850" cy="155" r="3" fill="#00D9FF" filter="url(#softGlow)">
      <animate attributeName="cx" from="800" to="1050" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="cy" from="160" to="160" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="880" cy="150" r="2" class="pulse-dot" fill="#00D9FF"/>
    <circle cx="980" cy="155" r="2" class="pulse-dot" fill="#00D9FF" style="animation-delay: 0.5s;"/>
  </g>
  <g id="globe">
    <circle cx="1090" cy="160" r="50" fill="none" stroke="#00BCEB" stroke-width="2" opacity="0.7"/>
    <ellipse cx="1090" cy="160" rx="50" ry="15" fill="none" stroke="#00BCEB" stroke-width="1" opacity="0.5"/>
    <ellipse cx="1090" cy="140" rx="50" ry="10" fill="none" stroke="#00BCEB" stroke-width="1" opacity="0.4"/>
    <ellipse cx="1090" cy="180" rx="50" ry="10" fill="none" stroke="#00BCEB" stroke-width="1" opacity="0.4"/>
    <path d="M 1090 110 Q 1100 160 1090 210" fill="none" stroke="#00BCEB" stroke-width="1" opacity="0.4"/>
    <path d="M 1090 110 Q 1080 160 1090 210" fill="none" stroke="#00BCEB" stroke-width="1" opacity="0.4"/>
    <circle cx="1090" cy="120" r="2.5" fill="#00D9FF" filter="url(#softGlow)" class="pulse-dot"/>
    <circle cx="1120" cy="145" r="2.5" fill="#00D9FF" filter="url(#softGlow)" class="pulse-dot" style="animation-delay: 0.3s;"/>
    <circle cx="1120" cy="175" r="2.5" fill="#00D9FF" filter="url(#softGlow)" class="pulse-dot" style="animation-delay: 0.6s;"/>
    <circle cx="1090" cy="200" r="2.5" fill="#00D9FF" filter="url(#softGlow)" class="pulse-dot" style="animation-delay: 0.9s;"/>
    <circle cx="1060" cy="175" r="2.5" fill="#00D9FF" filter="url(#softGlow)" class="pulse-dot" style="animation-delay: 0.6s;"/>
    <circle cx="1060" cy="145" r="2.5" fill="#00D9FF" filter="url(#softGlow)" class="pulse-dot" style="animation-delay: 0.3s;"/>
    <circle cx="1090" cy="160" r="6" fill="#00D9FF" opacity="0.8" filter="url(#cyanGlowFilter)"/>
  </g>
  <g id="text-section">
    <text x="640" y="80" font-family="'Courier New', monospace" font-size="42" font-weight="bold" fill="#F0F4F8" text-anchor="middle" letter-spacing="2" class="text-glow">
      CAIQUE GOMES
    </text>
    <text x="640" y="120" font-family="'Courier New', monospace" font-size="16" fill="#8297A3" text-anchor="middle" letter-spacing="1" opacity="0.9">
      Computer Science • Technology • AI • Logistics
    </text>
    <line x1="300" y1="130" x2="550" y2="130" stroke="#00BCEB" stroke-width="0.5" opacity="0.4"/>
    <line x1="730" y1="130" x2="980" y2="130" stroke="#00BCEB" stroke-width="0.5" opacity="0.4"/>
  </g>
  <g id="decorative-elements" opacity="0.3">
    <circle cx="100" cy="40" r="1" fill="#00BCEB"/>
    <circle cx="250" cy="50" r="1" fill="#00BCEB"/>
    <circle cx="450" cy="35" r="1" fill="#00BCEB"/>
    <circle cx="800" cy="45" r="1" fill="#00BCEB"/>
    <circle cx="1050" cy="50" r="1" fill="#00BCEB"/>
    <circle cx="1200" cy="40" r="1" fill="#00BCEB"/>
  </g>
</svg>