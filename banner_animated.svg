<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#c9d1d9" />
    </linearGradient>
    <linearGradient id="accent-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4872A" />
      <stop offset="100%" stop-color="#f3a74a" />
    </linearGradient>
    <style>
      .title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 48px;
        fill: url(#text-gradient);
        opacity: 0;
        animation: fade-in-up 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      }
      .subtitle {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 20px;
        fill: url(#accent-gradient);
        opacity: 0;
        animation: fade-in-up 1s cubic-bezier(0.2, 0.8, 0.2, 1) 0.3s forwards;
      }
      .desc {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 16px;
        fill: #8b949e;
        opacity: 0;
        animation: fade-in-up 1s cubic-bezier(0.2, 0.8, 0.2, 1) 0.6s forwards;
      }
      @keyframes fade-in-up {
        0% { opacity: 0; transform: translateY(20px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      .circle {
        animation: float 6s ease-in-out infinite;
      }
      .circle-2 {
        animation: float 8s ease-in-out infinite reverse;
      }
      @keyframes float {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-15px) scale(1.05); }
      }
    </style>
  </defs>
  <rect width="800" height="220" fill="url(#bg)" rx="10" />
  
  <!-- Decorative Elements -->
  <circle cx="700" cy="50" r="140" fill="#D4872A" opacity="0.06" class="circle" />
  <circle cx="100" cy="180" r="90" fill="#ffffff" opacity="0.02" class="circle-2" />
  
  <g transform="translate(50, 90)">
    <text class="title" x="0" y="0">Caique Gomes</text>
    <text class="subtitle" x="0" y="45">Large-Scale Logistics Operations | Computer Science</text>
    <text class="desc" x="0" y="75">Bridging Software Engineering with operational excellence (DHL, Amazon, Mercado Livre)</text>
  </g>
</svg>

"fix: encoding do banner"
